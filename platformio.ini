; UART Shell for M5Stack Cardputer ADV
; Lean build: LovyanGFX with a fixed panel config (no board autodetect),
; a tiny TCA8418 keyboard driver, no WiFi/BT.
;
; Arduino 3.3 (ESP-IDF 5.5) via pioarduino. Its stock ESP32-S3 libraries have
; USB host hub support and 3000-byte control transfers enabled, which radios
; like the FX-4CR need (internal hub with a CH340 and a sound chip).
;
; Windows: the core's archives contain very long paths. Either enable Win32
; long paths or point PlatformIO at a short directory, e.g.
;   set PLATFORMIO_CORE_DIR=C:\pio

[env:cardputer-adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
	-Os
	-DCORE_DEBUG_LEVEL=0
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=0
build_unflags =
	-O2
lib_deps =
	lovyan03/LovyanGFX@1.2.32
extra_scripts = post:tools/merge_bin.py
